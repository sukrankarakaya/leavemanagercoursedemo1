<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parolanı değiştir — İzin Yöneticisi</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>İzin Yöneticisi</h1>
      <form id="password-form" class="card" novalidate>
        <h2>Parolanı değiştir</h2>
        <p class="hint">Devam etmeden önce yeni bir parola belirleyin: 12–128 karakter, e-posta
          adresinizle ve mevcut parolanızla aynı olamaz.</p>
        <label for="current_password">Mevcut (geçici) parola</label>
        <input id="current_password" name="current_password" type="password"
               autocomplete="current-password" required aria-describedby="current_password-error" />
        <p id="current_password-error" class="field-error"></p>
        <label for="new_password">Yeni parola</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password"
               minlength="12" maxlength="128" required aria-describedby="new_password-error" />
        <p id="new_password-error" class="field-error"></p>
        <p id="form-error" class="form-error" role="alert"></p>
        <p id="form-status" class="form-status" role="status"></p>
        <button id="submit" type="submit">Parolayı değiştir</button>
      </form>
    </main>
    <script type="module">
      import { errorState, formView, HOME_PAGE, TEXT } from "/auth-view.js";
      import { api, showFieldErrors } from "/session.js";

      const form = document.getElementById("password-form");

      function render(state) {
        const view = formView("change", state);
        document.getElementById("submit").disabled = view.disabled;
        document.getElementById("submit").textContent = view.button;
        document.getElementById("form-error").textContent = view.formError;
        document.getElementById("form-status").textContent = view.status;
        showFieldErrors(form, view.fieldErrors);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        render({ kind: "submitting" });
        const result = await api("/api/auth/password", {
          method: "POST",
          body: {
            current_password: form.current_password.value,
            new_password: form.new_password.value,
          },
        });
        if (result && result.status === 204) {
          render({ kind: "success" });
          window.location.assign(HOME_PAGE);
          return;
        }
        render(result ? errorState(result.body) : { kind: "error", message: TEXT.genericError, fields: {} });
      });
      render({ kind: "idle" });
    </script>
  </body>
</html>
