# scripts/check.conf — the steps behind ./scripts/check (bootstrap 2026-11-08).
# GREENFIELD: kod henüz yok (kural 1: no spec, no code), bu yüzden tüm adımlar ve requires satırları
# YORUM olarak planlandı. Walking skeleton (ilk spec) araç zincirini kurar ve bunları etkinleştirir;
# o anda residue testi her iki profilde çalışır ve test sayısı kontrol edilir.
# Format: <name>: <command> — sırayla, ilk hatada durur. [fast] etiketi adda (komutta değil).
# Komutlar repo kökünden ve aktif .venv ile çalışır (Windows Git Bash: .venv/Scripts/python;
# skeleton bunu tek yerde çözecek). Her komut arkasında hiçbir süreç bırakmaz (Resource hygiene).
#
# --- Envanter (Resource hygiene a/b) ---
# ruff, mypy, lint-imports, pip-audit: tek seferlik süreçler, daemon yok.
#   mypy: dmypy (daemon) KULLANILMAZ, yalnızca `mypy` — resource hygiene: no type-check daemon.
# pytest: xdist yok (paralel worker bırakmaz); TestClient uygulamayı süreç içinde çalıştırır, sunucu
#   (uvicorn) başlatılmaz — resource hygiene: no app server in check.
#   Veri: her test tmp_path altında kendi SQLite'ı veya StaticPool'lu :memory: (rule 5); data/*.db asla.
# node --test: tek seferlik, watch modu yok (--watch KULLANILMAZ) — resource hygiene: no watcher.
# pip-audit: ağ gerektirir (PyPI/OSV), süreç bırakmaz; ağ yoksa full profil kırmızı (requires ile görünür).
#
# --- Planlanan requires satırları ---
# requires lint: .venv/Scripts/python -c "import sys; sys.exit(0 if sys.version_info[:2]==(3,12) else 1)"
# requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
# requires audit: .venv/Scripts/python -m pip_audit --version
#
# --- Planlanan adımlar ---
# lint [fast]: .venv/Scripts/python -m ruff check .
# format [fast]: .venv/Scripts/python -m ruff format --check .
# types [fast]: .venv/Scripts/python -m mypy app
# architecture [fast]: .venv/Scripts/lint-imports
# unit [fast]: .venv/Scripts/python -m pytest -q -p no:cacheprovider -m "not integration"
# web-test [fast]: node --test tests/web/
# integration: .venv/Scripts/python -m pytest -q -p no:cacheprovider -m integration
# coverage: .venv/Scripts/python -m pytest -q -p no:cacheprovider --cov=app/domain --cov=app/services --cov-fail-under=90
# audit: .venv/Scripts/python -m pip_audit -r requirements.lock
#
# Not: unit ∪ integration = tüm testler (seçici ile bölme, Two speeds rule 4). coverage adımı tüm
# suite'i tekrar çalıştırır; süre büyürse skeleton/plan unit+integration'ı coverage ile birleştirmeyi önerir.
