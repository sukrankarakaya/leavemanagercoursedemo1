# scripts/check.conf — the steps behind ./scripts/check (bootstrap 2026-11-08, etkinleşme: spec 0001).
# Format: <name>: <command> — sırayla, ilk hatada durur. [fast] etiketi adda (komutta değil).
# Komutlar repo kökünden `sh -c` ile çalışır. Python araçları tools/venv üzerinden: Windows
# (.venv/Scripts) ve Linux/CI (.venv/bin) aynı satırı kullanır. Önce: tools/setup.
#
# --- Kaynak hijyeni envanteri (docs/testing.md, Resource hygiene) ---
# ruff, mypy, lint-imports, pip-audit: tek seferlik süreçler.
# resource hygiene: no type-check daemon — `mypy`, asla `dmypy`.
# resource hygiene: no app server in check — TestClient uygulamayı süreç içinde çalıştırır; uvicorn yok.
# resource hygiene: no parallel workers — pytest-xdist yok.
# resource hygiene: no watcher — node --test, --watch olmadan.
# Veri (rule 5): her test tmp_path altında kendi SQLite'ını kullanır; data/*.db'ye hiç dokunulmaz.
#   -p no:cacheprovider: .pytest_cache yazılmaz (bir çalıştırmanın durumu sonrakine taşınmaz).
#   coverage: .coverage her çalıştırmada baştan yazılır (pytest-cov), gitignored.
# pip-audit ağ gerektirir (PyPI/OSV) — yalnızca full profilde.
#
# --- Önkoşullar (requires <step>: <command>, exit 0 = karşılandı) ---
requires lint: tools/venv python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)"
requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 21 ? 0 : 1)"
requires audit: tools/venv pip-audit --version
#
# --- Adımlar ---
lint [fast]: tools/venv python -m ruff check .
format [fast]: tools/venv python -m ruff format --check .
types [fast]: tools/venv python -m mypy app
architecture [fast]: tools/venv lint-imports
unit [fast]: tools/venv python -m pytest -q -p no:cacheprovider -m "not integration"
web-test [fast]: tools/web-test
integration: tools/venv python -m pytest -q -p no:cacheprovider -m integration
coverage: tools/venv python -m pytest -q -p no:cacheprovider --cov=app.domain --cov=app.services --cov-fail-under=90
audit: tools/venv pip-audit -r requirements.lock --progress-spinner off
#
# unit ∪ integration = tüm Python testleri (seçiciyle bölme, Two speeds rule 4);
# web-test: tools/web-test glob ile tests/web altındaki her *.test.js'i yakalar ve 0 testte kırmızı verir (A-1, A-2).
