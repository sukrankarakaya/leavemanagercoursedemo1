# Alembic CLI için (yeni revizyon üretmek): tools/venv alembic -c app/db/alembic.ini revision -m "<ad>"
# Uygulama migration'ları app/db/migrate.py ile çalıştırır; bu dosyayı okumaz.
# DB adresi DATABASE_URL ortam değişkeninden okunur (app/db/migrations/env.py).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
